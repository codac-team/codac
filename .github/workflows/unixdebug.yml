# Debug builds on Linux, under AddressSanitizer and UndefinedBehaviorSanitizer,
# plus one coverage run.
#
# The rest of this directory answers "does it build and do the tests pass?" on a
# wide spread of systems, all of it in Release. Nothing there ever runs codac
# under a sanitizer on Linux or macOS: windebugmatrix.yml is the only Debug
# workflow and its only sanitized entries are the MSVC ones (the MinGW ones are
# unsanitized for want of a runtime in that toolchain). The whole GCC/Clang
# sanitizer path of the top-level CMakeLists.txt -- the configuration this
# project is developed in -- was therefore never exercised by CI, so a
# use-after-free or a signed overflow could only ever be caught on a developer's
# machine. This workflow closes that gap, and macdebug.yml does the same for
# macOS.
#
# It also runs the examples, which no other workflow does beyond the two that
# tests.yml builds by hand: -D TEST_EXAMPLES=ON now builds every example against
# the in-tree library and runs it as an integration test (see
# examples/CMakeLists.txt). Under a sanitizer they are worth as much as the unit
# tests: they exercise long chains of the library the way a user writes them.
#
# GitHub only offers x86_64 and arm64 Linux runners, so the third distinct
# configuration below is a compiler rather than a third instruction set: Clang
# and GCC disagree often enough about undefined behaviour, and their sanitizer
# runtimes are different implementations, that running both is worth more than a
# third architecture reached through emulation -- where ASan does not work
# anyway, its shadow memory needing an address space QEMU cannot provide.
on:
    push:
        branches: ['**']
        tags-ignore: ['**']  # Ignore all tag pushes
    pull_request:

concurrency:
    # Keep only the newest run of this workflow for a given branch or pull
    # request: a push that supersedes another leaves the older run computing a
    # result nobody will read, while its jobs hold runners the newest run is
    # waiting for.
    #
    # The three release branches are excluded. They are where the jobs upload
    # their packages to a GitHub release (see the "github.ref_name==" conditions
    # further down), and cancelling such a run halfway would leave the release
    # with only part of its assets. The same expression is used in every
    # workflow of this directory, including the ones that publish nothing, so
    # that the rule stays a single thing to know.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref_name != 'codac1' && github.ref_name != 'codac2' && github.ref_name != 'codac2_codac4matlab' }}

jobs:
 unixdebug:
    runs-on: ${{ matrix.cfg.os }}
    # A sanitized Debug build is roughly an order of magnitude slower to run
    # than the Release builds of the other workflows, and the examples are run
    # on top of the test suite. Measured on this matrix: 37 min on GCC arm64,
    # 58 min on GCC x86_64, and more than three hours under Clang, whose
    # instrumentation is markedly more expensive here -- the first run of this
    # workflow spent its whole budget inside the test step and was cut there.
    # Six hours is GitHub's own ceiling; it is set to it because a shorter one
    # kills a job that is progressing, while ctest already bounds each
    # individual test to 1500 s, so a genuinely hung test cannot reach this.
    timeout-minutes: 360
    defaults:
        run:
            shell: bash
    strategy:
        fail-fast: false
        matrix:
            cfg:
            # The distribution's own compilers are used rather than a pinned
            # version from a PPA: on the newest Ubuntu they are already the
            # newest GCC and Clang, and every job prints what it actually got,
            # so an upgrade of the image shows up in the log instead of
            # silently doing nothing. Adding ubuntu-toolchain-r would also put
            # a Launchpad round-trip on the critical path of every job, which
            # has already taken this repository's CI down with a 504.
            - { os: ubuntu-26.04    , arch: x86_64, runtime: resolute, cc: gcc      , cxx: g++      , packages: 'g++'  , build_type: Debug  , with_python: 'ON' , coverage: false, desc: 'Ubuntu 26.04 GCC x86_64 Debug ASan+UBSan' }
            - { os: ubuntu-26.04-arm, arch: arm64 , runtime: resolute, cc: gcc      , cxx: g++      , packages: 'g++'  , build_type: Debug  , with_python: 'ON' , coverage: false, desc: 'Ubuntu 26.04 GCC arm64 Debug ASan+UBSan' }
            - { os: ubuntu-26.04    , arch: x86_64, runtime: resolute, cc: clang    , cxx: clang++  , packages: 'clang', build_type: Debug  , with_python: 'ON' , coverage: false, test_timeout: 300, desc: 'Ubuntu 26.04 Clang x86_64 Debug ASan+UBSan' }
            - { os: ubuntu-26.04-arm, arch: arm64 , runtime: resolute, cc: clang    , cxx: clang++  , packages: 'clang', build_type: Debug  , with_python: 'ON' , coverage: false, test_timeout: 300, desc: 'Ubuntu 26.04 Clang arm64 Debug ASan+UBSan' }
            - { os: ubuntu-26.04    , arch: x86_64, runtime: resolute, cc: gcc      , cxx: g++      , packages: 'g++'  , build_type: Release, with_python: 'ON' , coverage: true , desc: 'Ubuntu 26.04 GCC x86_64 Release coverage' }
    name: ${{ matrix.cfg.desc }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0
        clean: false

    - run: echo "VERBOSE=1" >> $GITHUB_ENV

    # setup-python rather than the interpreter of the image: the bindings need
    # the development headers, and this is how tests.yml already provides them.
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    # doxygen and graphviz are what the docstrings of the bindings are generated
    # from. pybind11 is deliberately not installed from the distribution: codac
    # asks for 3.0.1 and fetches that version itself when it is not found, which
    # is what every other workflow of this directory ends up using, whereas the
    # package of the newest Ubuntu got picked up first and left codac-sympy
    # linking a pybind11::pybind11 target that its CMake config does not define.
    - name: Toolchain and dependencies
      run: |
        sudo apt-get -q update
        sudo apt-get -y install ${{ matrix.cfg.packages }} cmake catch2 doxygen graphviz dpkg-dev || true
        ${{ matrix.cfg.cxx }} --version

    # The same prebuilt IBEX package as unixmatrix.yml. It is a Release build
    # made with the distribution's GCC, which is exactly what both compilers of
    # this matrix link against on Linux: Clang uses libstdc++ here too, so there
    # is no ABI mismatch to work around, unlike on macOS. A library that is not
    # itself instrumented is no obstacle to AddressSanitizer either -- it simply
    # does not check what happens inside IBEX, which is not what this workflow
    # is looking for.
    - name: IBEX
      run: |
        wget https://github.com/lebarsfa/ibex-lib/releases/download/ibex-2.8.9.20260819/libibex-dev-2.8.9.20260819-0${{ matrix.cfg.runtime }}0_$(dpkg --print-architecture).deb --no-check-certificate -nv
        sudo dpkg -i libibex-dev-2.8.9.20260819-0${{ matrix.cfg.runtime }}0_$(dpkg --print-architecture).deb
        rm -f libibex-dev-2.8.9.20260819-0${{ matrix.cfg.runtime }}0_$(dpkg --print-architecture).deb

    - name: Python tooling
      run: |
        python -m pip install --upgrade pip wheel setuptools numpy sympy
        if [ "${{ matrix.cfg.coverage }}" = "true" ]; then
          python -m pip install --upgrade gcovr
        fi

    # The instrumentation is requested through -D WITH_COVERAGE=ON rather than
    # by passing --coverage by hand, so that this job and a developer running
    # `make coverage` measure the same build with the same tool: the top-level
    # CMakeLists.txt is the single place where the flags, the gcov executable
    # matching the compiler and the gcovr filters are decided. The build type
    # stays Release, so the coverage job compiles exactly what the Release jobs
    # of the other workflows compile, instrumentation aside.
    - name: Configure and build
      env:
        CC: ${{ matrix.cfg.cc }}
        CXX: ${{ matrix.cfg.cxx }}
      run: |
        mkdir build ; cd build
        cmake \
          -D WITH_COVERAGE=${{ matrix.cfg.coverage && 'ON' || 'OFF' }} \
          -D CMAKE_BUILD_TYPE=${{ matrix.cfg.build_type }} \
          -D CMAKE_CXX_FLAGS="-fPIC" \
          -D CMAKE_C_FLAGS="-fPIC" \
          -D CMAKE_INSTALL_PREFIX="../codac" \
          -D BUILD_TESTS=ON \
          -D TEST_EXAMPLES=ON \
          -D WITH_PYTHON=${{ matrix.cfg.with_python }} \
          -D PYBIND11_FINDPYTHON=OFF \
          -D WITH_CAPD=OFF \
          .. 2>&1 | tee configure.log
        cmake --build . -j 4

    # The point of the Debug jobs is the sanitizers, and the top-level
    # CMakeLists.txt deliberately falls back to an unsanitized Debug build when
    # it cannot find their runtime rather than failing to link. That fallback is
    # the right default for someone building codac by hand, and exactly the
    # wrong outcome here: the job would come out green having checked nothing it
    # was written for.
    - name: Check that the sanitizers really are enabled
      if: matrix.cfg.build_type == 'Debug'
      run: |
        if grep -q "will not be sanitized" build/configure.log ; then
          echo "This job exists to run the suite under ASan and UBSan, and cmake reported:"
          grep "will not be sanitized" build/configure.log
          exit 1
        fi
        echo "Sanitizers enabled."

    # The unit tests and the examples are the same ctest suite: examples are
    # registered as tests by examples/CMakeLists.txt, so this one command runs
    # both, and a sanitizer report in either fails the job.
    - name: Unit tests and examples
      run: |
        cd build
        # ctest's own default here is 1500 s per test, which is far above what
        # any test of this suite needs even instrumented -- the slowest of them
        # takes under three minutes on a developer machine under ASan. Where a
        # job sets test_timeout, that bound is tightened so that a test which
        # stops progressing is reported as the one at fault, with its output,
        # instead of the job being killed hours later with nothing to read.
        TIMEOUT_FLAG=""
        if [ -n "${{ matrix.cfg.test_timeout }}" ]; then
          TIMEOUT_FLAG="--timeout ${{ matrix.cfg.test_timeout }}"
        fi
        # -V on the Debug jobs only: the coverage job runs the same suite
        # without instrumentation, and its verbose output would carry nothing
        # the others do not already show.
        VERBOSE_FLAG=""
        if [ "${{ matrix.cfg.build_type }}" = "Debug" ]; then VERBOSE_FLAG="-V" ; fi
        ctest $VERBOSE_FLAG --output-on-failure $TIMEOUT_FLAG 2>&1 | tee ctest.log

    # ctest is run verbose so that everything the sanitizers print reaches the
    # log. ASan and UBSan do not agree on what a diagnostic costs: a leak or a
    # buffer overflow aborts the process and fails the test, but a UBSan runtime
    # error only prints and lets the run continue, so a test can pass having
    # reported dozens of undefined behaviours. Without -V that output is thrown
    # away for every test that passes -- which is precisely the output worth
    # reading here.
    - name: Sanitizer diagnostics
      if: always()
      run: |
        log=build/ctest.log
        [ -f "$log" ] || { echo "No ctest output to scan." ; exit 0 ; }
        # A digest, because the verbose log of the whole suite is far too long
        # to scan by eye. The step reports rather than judges: it never fails
        # the job, the tests themselves decide that.
        n=$(grep -cE "runtime error:|ERROR: AddressSanitizer|ERROR: LeakSanitizer|SUMMARY: (Address|Undefined|Leak)Sanitizer" "$log" || true)
        echo "Sanitizer diagnostics found: $n"
        if [ "$n" -gt 0 ]; then
          echo "--- distinct messages, most frequent first ---"
          # awk rather than head: this shell runs with pipefail, and head
          # closing the pipe early makes sort die on SIGPIPE, which failed the
          # step -- the one thing it was written never to do.
          grep -hoE "runtime error: .*|ERROR: (Address|Leak)Sanitizer: [a-z-]+" "$log" \
            | sed -E "s/0x[0-9a-f]+/0xADDR/g" | sort | uniq -c | sort -rn | awk 'NR<=40'
          echo "--- first occurrences in context ---"
          grep -nE "runtime error:|ERROR: (Address|Leak)Sanitizer" "$log" | awk 'NR<=20'
        fi

    # coverage-report, not coverage: the suite has already been run by the step
    # above, and this target only turns the counters it left behind into a
    # report. The gcovr invocation lives in the top-level CMakeLists.txt, where
    # `make coverage` reaches the very same one.
    - name: Coverage report
      if: matrix.cfg.coverage
      run: |
        cd build
        gcovr --version
        cmake --build . --target coverage-report

    - uses: actions/upload-artifact@v4
      if: matrix.cfg.coverage
      with:
        name: coverage-report
        path: |
          build/coverage.*
        retention-days: 14
