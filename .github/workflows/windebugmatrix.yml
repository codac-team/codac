# Debug builds and unit tests on Windows, with the latest MinGW and MSVC
# toolchains, on x64, x86 and (MSVC only) arm64, on both Windows 2022 (MSVC
# v143 / Visual Studio 2022) and the very latest Windows images (MSVC v145 /
# Visual Studio 2026, on windows-2025-vs2026 and windows-11-vs2026-arm).
# Unlike vcmatrix.yml/unixmatrix.yml (which build in Release mode and
# package the result), this workflow only compiles and runs the test suite
# in Debug configuration, so that the sanitizers enabled for Debug builds
# (see the "if(CMAKE_BUILD_TYPE STREQUAL "Debug" OR
# CMAKE_CONFIGURATION_TYPES)" block in the top-level CMakeLists.txt)
# actually get exercised on Windows. There is no MinGW entry beyond
# windows-2022/x64/x86, and no MinGW arm64 entry at all: no such
# configuration exists anywhere else in this repo's workflows (only
# vc17/vc18 have an arm64 variant, and only vc17 is built on windows-2022),
# so MinGW stays on windows-2022 here too.
#
# All entries use the prebuilt (Release-only) choco IBEX package, same as
# vcmatrix.yml/unixmatrix.yml -- IBEX and the gaol library it bundles are
# NOT rebuilt from source here. Under MSVC this means codac's own Debug
# build is forced onto the Release CRT (/MD instead of the default /MDd)
# so it stays link-compatible with that prebuilt gaol.lib; see the
# CMAKE_MSVC_RUNTIME_LIBRARY override in the top-level CMakeLists.txt for
# the details of what that trades away (debug-CRT heap/iterator checking)
# versus what it keeps (unoptimized code, debug symbols, ASan).
#
# The MinGW entries simply pin the newest MinGW version (same as
# unixmatrix.yml's own mingw15 entries): unlike MSVC, the choco `mingw`
# package does not ship libasan.a/libubsan.a at all here, for either x86 or
# x64, in any of the versions it offers (checked via `g++
# -print-file-name=libasan*`/`libubsan*` across mingw15 down to mingw11) --
# there is no version/architecture combination worth hunting for. The
# top-level CMakeLists.txt detects this (the same capability probe used for
# the MSVC ASan runtime DLL below) and simply leaves Debug builds
# unsanitized on a toolchain that lacks the runtime, rather than failing at
# link time with "ld.exe: cannot find -lasan/-lubsan"; actual ASan coverage
# on Windows comes from the MSVC entries in this matrix instead.
on:
    push:
        branches-ignore:
        - codac2_codac4matlab
        tags-ignore: ['**']  # Ignore all tag pushes
    pull_request:
        branches-ignore:
        - codac2_codac4matlab

concurrency:
    # Keep only the newest run of this workflow for a given branch or pull
    # request: a push that supersedes another leaves the older run computing a
    # result nobody will read, while its jobs hold runners the newest run is
    # waiting for.
    #
    # The three release branches are excluded. They are where the jobs upload
    # their packages to a GitHub release (see the "github.ref_name==" conditions
    # further down), and cancelling such a run halfway would leave the release
    # with only part of its assets. The same expression is used in every
    # workflow of this directory, including the ones that publish nothing, so
    # that the rule stays a single thing to know.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref_name != 'codac1' && github.ref_name != 'codac2' && github.ref_name != 'codac2_codac4matlab' }}

jobs:
 windebugmatrix:
    runs-on: ${{ matrix.cfg.os }}
    # A test binary that cannot load a DLL it needs does not always fail fast:
    # on the Visual Studio 2026 images every test of the suite instead sat
    # until ctest's own 1500 s timeout, so the job kept going for the six hours
    # GitHub allows before killing it, twice per run. Two hours is well above
    # the twenty minutes a healthy job takes here and turns such a hang into a
    # quick red job rather than a day of runner time.
    timeout-minutes: 120
    env:
        IBEX_RUNTIME: ${{ matrix.cfg.runtime }}
    defaults:
        run:
            shell: ${{ matrix.cfg.shell }}
    strategy:
        fail-fast: false
        matrix:
            cfg:
            - { os: windows-2022, shell: cmd, arch: x64  , bitness: 64, runtime: mingw15, cmake_params: '-G "MinGW Makefiles" -D CMAKE_BUILD_TYPE=Debug', cmake_flags: '-fPIC', desc: 'Windows MinGW x64 Debug (unsanitized)' }
            - { os: windows-2022, shell: cmd, arch: x86  , bitness: 32, runtime: mingw15, cmake_params: '-G "MinGW Makefiles" -D CMAKE_BUILD_TYPE=Debug', cmake_flags: '-fPIC', choco_flags: '--x86', desc: 'Windows MinGW x86 Debug (unsanitized)' }
            - { os: windows-2022, shell: cmd, arch: x64  , bitness: 64, runtime: vc17   , cmake_params: '-G "Visual Studio 17" -T v143 -A x64'  , cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', desc: 'Windows Visual Studio 2022 x64 Debug' }
            - { os: windows-2022, shell: cmd, arch: x86  , bitness: 32, runtime: vc17   , cmake_params: '-G "Visual Studio 17" -T v143 -A Win32', cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', choco_flags: '--x86', desc: 'Windows Visual Studio 2022 x86 Debug' }
            - { os: windows-11-arm, shell: cmd, arch: arm64, bitness: 64, runtime: vc17 , cmake_params: '-G "Visual Studio 17" -T v143 -A arm64', cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', desc: 'Windows Visual Studio 2022 arm64 Debug' }
            - { os: windows-2025-vs2026  , shell: cmd, arch: x64  , bitness: 64, runtime: vc18, cmake_params: '-G "Visual Studio 18" -T v145 -A x64'  , cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', desc: 'Windows Visual Studio 2026 x64 Debug' }
            - { os: windows-2025-vs2026  , shell: cmd, arch: x86  , bitness: 32, runtime: vc18, cmake_params: '-G "Visual Studio 18" -T v145 -A Win32', cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', choco_flags: '--x86', desc: 'Windows Visual Studio 2026 x86 Debug' }
            - { os: windows-11-vs2026-arm, shell: cmd, arch: arm64, bitness: 64, runtime: vc18, cmake_params: '-G "Visual Studio 18" -T v145 -A arm64', cmake_flags: ' /MP4 /wd4267 /wd4244 /wd4305 /wd4996', desc: 'Windows Visual Studio 2026 arm64 Debug' }
    name: ${{ matrix.cfg.desc }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0
        clean: false
    - run: echo "VERBOSE=1" >> $GITHUB_ENV
      shell: bash
    - run: |
        choco install -y -r --no-progress wget
        wget https://lebarsfa.github.io/cache/cmake_extra_tools.zip --no-check-certificate -nv
        7z x cmake_extra_tools.zip -o"%SystemDrive%" -y
        del /f /q cmake_extra_tools.zip
        wget https://gist.github.com/lebarsfa/237841f9e5dad55ef192713b3b1b2f16/raw/04d77ced3457346c55f183ca12a10dbcb850e6d5/refreshenv.bashrc --no-check-certificate -nv
        move /y refreshenv.bashrc %USERPROFILE%
    # MinGW is pinned to the single newest version choco offers (15.2.0):
    # none of its versions ship libasan/libubsan for this package, for
    # either x86 or x64 (see the header comment above), so there is no
    # ASan/UBSan-capable candidate left to probe for -- the top-level
    # CMakeLists.txt detects the missing runtime itself and builds
    # unsanitized instead. BASHMINGWPATH is written to $GITHUB_ENV so every
    # later step (regardless of shell) picks it up automatically, without
    # needing choco's own refreshenv.bashrc dance.
    - run: |
        choco install -y -r --no-progress mingw --version=15.2.0 --force ${{ matrix.cfg.choco_flags }}
        echo "BASHMINGWPATH=/c/ProgramData/mingw64/mingw${{ matrix.cfg.bitness }}/bin" >> "$GITHUB_ENV"
      if: startsWith(matrix.cfg.runtime, 'mingw')
      shell: bash
    - run: |
        wget https://github.com/lebarsfa/ibex-lib/releases/download/ibex-2.8.9.20260819/ibex.2.8.9.20260819.nupkg --no-check-certificate -nv
        choco install -y -r --no-progress --ignore-dependencies -s . ibex --version=2.8.9.20260819 ${{ matrix.cfg.choco_flags }} --params "'/url:https://github.com/lebarsfa/ibex-lib/releases/download/ibex-2.8.9.20260819/ibex_${{ matrix.cfg.arch }}_%IBEX_RUNTIME%.zip'"
        del /f /q ibex.2.8.9.20260819.nupkg
    - run: |
        if [ -n "${BASHMINGWPATH:-}" ]; then export PATH="$BASHMINGWPATH:$PATH" ; fi
        mkdir build ; cd build
        cmake -E env CXXFLAGS="${{ matrix.cfg.cmake_flags }}" CFLAGS="${{ matrix.cfg.cmake_flags }}" cmake ${{ matrix.cfg.cmake_params }} -D CMAKE_INSTALL_PREFIX="../codac" -D BUILD_TESTS=ON ..
        cmake --build . -j 4 --config Debug --target install
        cd ..
      shell: bash
    - run: |
        if [ -n "${BASHMINGWPATH:-}" ]; then export PATH="$BASHMINGWPATH:$PATH" ; fi
        cd build && ctest -C Debug -V --output-on-failure
        cd ..
      shell: bash
    # A test killed by a signal loses everything it had written to its
    # block-buffered standard output, so ctest reports the signal and nothing
    # else. That is all this job has ever shown for the tests that crash on it,
    # every one of them a user of Eigen's matrix product (arithmetic_mul and
    # arithmetic_div crash where arithmetic_add and arithmetic_sub pass), and a
    # bare signal says nothing about where. Re-running the first few failures
    # under gdb prints the faulting frame, which is the one thing missing to
    # diagnose them. The step reports rather than judges: it only runs after a
    # failure, and never turns a green job red on its own.
    - name: Backtrace of the failed tests
      if: failure()
      continue-on-error: true
      run: |
        if [ -n "${BASHMINGWPATH:-}" ]; then export PATH="$BASHMINGWPATH:$PATH" ; fi

        if ! command -v gdb > /dev/null 2>&1 ; then
          echo "No gdb in this toolchain, skipping the backtraces."
          exit 0
        fi

        failed=build/Testing/Temporary/LastTestsFailed.log
        if [ ! -f "$failed" ] ; then
          echo "ctest recorded no failed test, nothing to trace."
          exit 0
        fi

        cd build
        # LastTestsFailed.log holds one "<index>:<test name>" per line; the C++
        # tests are the "<target>_cpp" ones and their executable is the target
        # itself, next to the tests directory of this single-configuration
        # build. Three backtraces are plenty to identify a common frame, and
        # keep this step short.
        sed 's/^[0-9]*://' "../$failed" | grep '_cpp$' | head -3 | while read -r name ; do
          exe="tests/${name%_cpp}.exe"
          [ -f "$exe" ] || continue
          echo "===================== $exe ====================="
          gdb -batch -ex "set confirm off" -ex run -ex "bt 40" --args "./$exe" 2>&1 | tail -60
        done
      shell: bash

 # The Windows counterpart of the packaging jobs of unixdebug.yml and
 # macdebug.yml: the two ways of consuming an installed Codac --
 # find_package(CODAC) through codac-config.cmake and the export set beside it,
 # and pkg-config through codac.pc -- are written by hand in different places of
 # src/CMakeLists.txt, had drifted apart in both directions, and nothing in CI
 # built anything against an installed Codac at all. See
 # tests/packaging/check_consumer_parity.sh.
 #
 # How much of the check runs depends on the toolchain, and the matrix says so
 # per entry rather than leaving it to be discovered:
 #
 #  - MinGW gets both halves. pkg-config answers in -I/-L/-l, which is what a
 #    GCC driver takes, and the Makefile generator records the command lines the
 #    comparison reads back.
 #  - MSVC gets the find_package half alone. cl.exe takes none of those flags,
 #    and the Visual Studio generators write neither compile_commands.json nor
 #    link.txt. That half is still worth its runner time: it is the only place
 #    anything is built against an installed Codac with MSVC at all, and it is
 #    what covers arm64, for which this matrix has no MinGW entry.
 #
 # Release, without the tests, which is what keeps these jobs short next to
 # their neighbours -- and, unlike the Debug matrix above, what an ordinary
 # consumer can actually link against on the MSVC entries, whose archives are
 # built with /MDd and under ASan.
 packaging:
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 90
    defaults:
        run:
            shell: bash
    strategy:
        fail-fast: false
        matrix:
            cfg:
            - { os: windows-2022  , arch: x64  , bitness: 64, runtime: mingw15, generator: 'MinGW Makefiles'  , cmake_arch: '', mingw: true , require_pkgconfig: true , desc: 'Windows MinGW x64 packaging (find_package vs pkg-config)' }
            - { os: windows-2022  , arch: x86  , bitness: 32, runtime: mingw15, generator: 'MinGW Makefiles'  , cmake_arch: '', mingw: true , require_pkgconfig: true , choco_flags: '--x86', desc: 'Windows MinGW x86 packaging (find_package vs pkg-config)' }
            - { os: windows-11-arm, arch: arm64, bitness: 64, runtime: vc17   , generator: 'Visual Studio 17', cmake_arch: 'arm64', mingw: false, require_pkgconfig: false, desc: 'Windows Visual Studio 2022 arm64 packaging (find_package only)' }
    name: ${{ matrix.cfg.desc }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0
        clean: false

    - name: Tools
      run: |
        choco install -y -r --no-progress wget
        if [ "${{ matrix.cfg.mingw }}" = "true" ]; then
          choco install -y -r --no-progress mingw --version=15.2.0 --force ${{ matrix.cfg.choco_flags }}
          echo "BASHMINGWPATH=/c/ProgramData/mingw64/mingw${{ matrix.cfg.bitness }}/bin" >> "$GITHUB_ENV"
          # pkgconfiglite is what puts pkg-config.exe on PATH; the image has no
          # pkg-config of its own.
          choco install -y -r --no-progress pkgconfiglite
        fi

    - name: IBEX
      run: |
        wget https://github.com/lebarsfa/ibex-lib/releases/download/ibex-2.8.9.20260819/ibex.2.8.9.20260819.nupkg --no-check-certificate -nv
        choco install -y -r --no-progress --ignore-dependencies -s . ibex --version=2.8.9.20260819 ${{ matrix.cfg.choco_flags }} --params "'/url:https://github.com/lebarsfa/ibex-lib/releases/download/ibex-2.8.9.20260819/ibex_${{ matrix.cfg.arch }}_${{ matrix.cfg.runtime }}.zip'"
        rm -f ibex.2.8.9.20260819.nupkg

    - name: Build and install Codac
      run: |
        if [ -n "${BASHMINGWPATH:-}" ]; then export PATH="$BASHMINGWPATH:$PATH" ; fi
        mkdir build ; cd build
        ARCH_ARG=""
        if [ -n "${{ matrix.cfg.cmake_arch }}" ]; then ARCH_ARG="-A ${{ matrix.cfg.cmake_arch }}" ; fi
        cmake -G "${{ matrix.cfg.generator }}" $ARCH_ARG \
          -D CMAKE_BUILD_TYPE=Release \
          -D CMAKE_INSTALL_PREFIX="$PWD/../codac_install" \
          -D BUILD_TESTS=OFF \
          -D WITH_PYTHON=OFF \
          -D WITH_CAPD=OFF \
          ..
        cmake --build . -j 4 --config Release --target install

    # Where IBEX ended up is decided by its chocolatey package, so it is read
    # back from the cache CMake just wrote rather than guessed: IBEX_DIR points
    # at <prefix>/share/ibex/cmake, and ibex.pc sits in <prefix>/share/pkgconfig
    # next to it. codac.pc names ibex on its Requires: line and cannot be
    # resolved without it.
    - name: Locate the pkg-config file of IBEX
      if: matrix.cfg.mingw
      run: |
        ibex_cmake_dir=$(grep '^IBEX_DIR:' build/CMakeCache.txt | cut -d= -f2-)
        ibex_prefix=$(cd "$ibex_cmake_dir/../../.." && pwd)
        echo "IBEX prefix: $ibex_prefix"
        ls "$ibex_prefix/share/pkgconfig"
        # Left in the shell's own "/c/..." form; check_consumer_parity.sh runs
        # it through cygpath before handing it to pkg-config, which is a native
        # Windows binary and reads "C:/...".
        echo "IBEX_PKG_CONFIG_PATH=$ibex_prefix/share/pkgconfig" >> "$GITHUB_ENV"

    - name: find_package and pkg-config must agree
      run: |
        if [ -n "${BASHMINGWPATH:-}" ]; then export PATH="$BASHMINGWPATH:$PATH" ; fi
        args=(--prefix "$PWD/codac_install" --build-dir "$PWD/build_packaging_check")
        if [ "${{ matrix.cfg.require_pkgconfig }}" = "true" ]; then
          args+=(--require-pkgconfig --pkg-config-path "$IBEX_PKG_CONFIG_PATH")
        else
          # The Visual Studio generators record no command line to compare, so
          # the script is told to build the consumer the way this job builds
          # Codac and runs the find_package half alone.
          args+=(--generator "${{ matrix.cfg.generator }}")
          args+=(--cmake-arg -A --cmake-arg "${{ matrix.cfg.cmake_arch }}")
        fi
        bash tests/packaging/check_consumer_parity.sh "${args[@]}"

 # Les exemples, construits contre la bibliothèque de l'arbre et exécutés comme
 # tests d'intégration par ctest. -D TEST_EXAMPLES=ON n'était activé que par
 # tests.yml, unixdebug.yml et macdebug.yml : les exemples n'avaient donc jamais
 # tourné sous Windows, la plateforme où le traitement des chemins, les sorties
 # graphiques et la chaîne d'outils s'écartent le plus de celles qui les
 # exercent.
 #
 # Un job à part plutôt qu'un drapeau sur la matrice ci-dessus : les exemples
 # forment une suite d'intégration à eux seuls, et les ajouter aux huit jobs
 # Debug multiplierait un workflow qui occupe déjà près d'une heure. Une seule
 # chaîne d'outils suffit à répondre « les exemples tournent-ils sous
 # Windows ? », et MSVC x64 est celle sur laquelle se trouvent la plupart des
 # utilisateurs de Codac.
 examples:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
        run:
            shell: cmd
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0
        clean: false
    - run: echo "VERBOSE=1" >> $GITHUB_ENV
      shell: bash
    - run: |
        choco install -y -r --no-progress wget
        wget https://lebarsfa.github.io/cache/cmake_extra_tools.zip --no-check-certificate -nv
        7z x cmake_extra_tools.zip -o"%SystemDrive%" -y
        del /f /q cmake_extra_tools.zip
    - run: |
        wget https://github.com/lebarsfa/ibex-lib/releases/download/ibex-2.8.9.20260819/ibex.2.8.9.20260819.nupkg --no-check-certificate -nv
        choco install -y -r --no-progress --ignore-dependencies -s . ibex --version=2.8.9.20260819 --params "'/url:https://github.com/lebarsfa/ibex-lib/releases/download/ibex-2.8.9.20260819/ibex_x64_vc17.zip'"
        del /f /q ibex.2.8.9.20260819.nupkg

    # Debug, comme le reste de ce workflow, donc désinfecté : le CMakeLists de
    # premier niveau active /fsanitize=address sur MSVC et place lui-même le
    # runtime clang_rt.asan à portée des exécutables.
    - run: |
        mkdir build ; cd build
        cmake -E env CXXFLAGS=" /MP4 /wd4267 /wd4244 /wd4305 /wd4996" CFLAGS=" /MP4 /wd4267 /wd4244 /wd4305 /wd4996" cmake -G "Visual Studio 17" -T v143 -A x64 -D BUILD_TESTS=ON -D TEST_EXAMPLES=ON -D CMAKE_INSTALL_PREFIX="../codac" ..
        cmake --build . -j 4 --config Debug
      shell: bash

    # Les exemples seuls : la suite unitaire est déjà couverte par la matrice
    # ci-dessus sur ce même jeu d'outils, et la relancer ici ne dirait rien de
    # neuf.
    - run: |
        cd build
        ctest -C Debug -R codac2_examples_ -V --output-on-failure
      shell: bash
